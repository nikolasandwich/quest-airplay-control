<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quest 鼠标控制</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f2f2f2;color:#333;font-family:system-ui,sans-serif}
main{position:fixed;inset:0}header{position:absolute;left:8%;right:8%;top:5%;height:25%;overflow:auto;text-align:center}
h1{font-size:clamp(20px,3vw,36px);margin:0 0 16px}p{font-size:clamp(16px,2vw,24px);line-height:1.5;margin:0}
footer{position:absolute;left:8%;right:8%;bottom:5%;height:15%;overflow:auto;text-align:center;font-size:clamp(14px,1.8vw,22px)}
</style></head><body><main>
<header><h1>直接控制，无需追圈</h1><p>回到想用的 iPad 应用，移动射线控制鼠标。<br>需要恢复时，在 Quest 点“恢复控制”。</p></header>
<footer><p id="connection">正在连接头显状态…</p><p id="detail">此页无需保持打开；恢复控制不会自动把真实指针移到中央。</p></footer>
</main><script>
const connection=document.getElementById('connection');
let lastSuccess=-Infinity;
function stale(){if(Date.now()-lastSuccess>2500)connection.textContent='头显状态暂不可用；此页不引导鼠标动作。';}
setInterval(stale,250);
async function poll(){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),1500);
  try{
    const response=await fetch('/state',{cache:'no-store',signal:controller.signal});
    if(!response.ok)throw Error('unavailable');await response.json();
    lastSuccess=Date.now();connection.textContent='头显服务可达 · 无需在此页校准';
  }catch(e){stale();}finally{clearTimeout(timer);setTimeout(poll,500);}
}
poll();
</script></body></html>
